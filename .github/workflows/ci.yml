name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install + compile transpiler
        run: |
          npm ci
          npm run build

      - name: Unit + integration tests
        run: npm test

      - name: Semantic differential probes
        run: npm run audit:semantics
